<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RealCraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#10192e;--panel:#1b2a4a;--grass:#5da130;--gold:#ffcf33;--text:#eef3ff;--mut:#9fb0d3}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;font-family:Rubik,system-ui,sans-serif;color:var(--text);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;padding:24px;overflow:auto;background:linear-gradient(90deg,rgba(16,25,46,.95) 0,rgba(16,25,46,.6) 55%,rgba(16,25,46,0))}
.box{width:min(470px,100%);margin:auto 0}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(20px,4vw,28px);color:var(--gold);text-shadow:3px 3px 0 #6b4a00;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px;line-height:1.4;font-size:13px}
label.nick{display:block;font-weight:600;margin-bottom:6px}
#nick,#pass,select.lang-sel{width:100%;box-sizing:border-box;padding:12px;font:inherit;color:var(--text);background:#0c1426;border:3px solid #3a4f80;border-radius:0;margin-bottom:12px}
.card{background:var(--panel);border:3px solid #3a4f80;padding:8px 12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.card b{color:var(--mut);font-weight:400}
.btn{font:inherit;font-weight:600;padding:10px 14px;background:var(--grass);color:#10260a;border:0;border-bottom:4px solid #3a6b1b;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:#3a4f80;color:var(--text);border-bottom-color:#26365a}
#play{width:100%;padding:14px;font-family:'Press Start 2P',monospace;font-size:13px;margin-bottom:8px}
#bonus,#fsMenu,#newTab{width:100%;margin-bottom:8px}
#err{color:#ff9d8a;min-height:20px;margin:8px 0 0;font-size:13px}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:12px;color:var(--mut)}
dt{color:var(--text);font-weight:600}dd{margin:0}
#hud{display:none;position:fixed;inset:0;z-index:2;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:9px;top:0;width:2px;height:20px}#cross:after{top:9px;left:0;height:2px;width:20px}
#info{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.6);padding:6px 10px;font-size:12px;line-height:1.4}
#bar{position:absolute;left:50%;bottom:75px;transform:translateX(-50%);display:flex;gap:3px;padding:4px;background:rgba(0,0,0,.6);max-width:96vw;overflow-x:auto;scrollbar-width:none;pointer-events:auto;touch-action:pan-x}
#bar::-webkit-scrollbar{display:none}
.slot{width:40px;height:40px;flex:none;border:3px solid #555;background:#222 center/28px no-repeat;image-rendering:pixelated;position:relative;cursor:pointer}
.slot.on{border-color:#fff}
.slot.empty{filter:grayscale(1) brightness(.55);border-style:dashed}
.slot i{position:absolute;right:2px;bottom:0;font:normal 10px Rubik,sans-serif;color:#ddd;text-shadow:1px 1px #000}
.slot em{position:absolute;left:2px;bottom:0;font:normal 600 10px Rubik,sans-serif;color:#fff;text-shadow:1px 1px #000}
#mini-hud{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.7);border:2px solid #3a4f80;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;text-align:right;pointer-events:auto}
#mini-hearts{color:#ff4d4d;font-size:15px;letter-spacing:2px}
#mini-coins{color:var(--gold);font-weight:600}
#mobile-controls{display:none;position:absolute;inset:0;pointer-events:none;z-index:10}
.mob-btn{position:absolute;background:rgba(27,42,74,.75);border:2px solid #3a4f80;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;border-radius:50%;text-shadow:1px 1px #000}
.mob-btn:active{background:rgba(58,79,128,.95)}
#joy{position:absolute;left:24px;bottom:70px;width:130px;height:130px;border-radius:50%;background:rgba(27,42,74,.45);border:3px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.55)}
#btn-jump{right:24px;bottom:85px;width:70px;height:70px;font-size:24px;background:rgba(93,161,48,.8);border-color:#5da130}
#btn-break{right:108px;bottom:70px;width:70px;height:70px;font-size:26px;background:rgba(200,60,60,.8);border-color:#d9534f}
#btn-menu-mob{right:12px;top:140px;width:44px;height:44px;font-size:20px;border-radius:8px}
#fs-btn{position:absolute;right:12px;top:90px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(27,42,74,.8);border:2px solid #3a4f80;border-radius:8px;font-size:20px;pointer-events:auto;cursor:pointer}
#pc-lock-btn{position:absolute;left:12px;top:60px;background:rgba(255,207,51,.85);color:#10192e;padding:8px 12px;font-weight:bold;border-radius:6px;cursor:pointer;pointer-events:auto;font-size:12px;border:2px solid #fff;z-index:12}
body.phone #bar{bottom:6px}
body.phone #name{bottom:58px}
body.phone #chat,body.phone #chatin{bottom:210px}
body.phone #hand-item{right:12vw;width:90px;height:90px}
body.phone .slot{width:36px;height:36px}
body.phone #info{font-size:10px;padding:4px 6px}
#hand-item{position:absolute;right:35vw;bottom:0;width:120px;height:120px;background-size:contain;background-repeat:no-repeat;background-position:bottom right;image-rendering:pixelated;pointer-events:none;transform:rotate(-15deg);transform-origin:bottom right;transition:transform .1s}
#hand-item.swing{transform:rotate(10deg) translateY(-20px)}
#name{position:absolute;left:50%;bottom:125px;transform:translateX(-50%);font-weight:600;text-shadow:2px 2px 0 #000;font-size:13px}
#chat{position:absolute;left:12px;bottom:130px;width:min(380px,70vw);font-size:13px;text-shadow:1px 1px 0 #000}
#chat div{background:rgba(0,0,0,.5);padding:2px 6px;margin-top:2px;word-break:break-word}
#chatin{display:none;position:absolute;left:12px;bottom:130px;width:min(380px,70vw);pointer-events:auto}
#chatin input{width:100%;box-sizing:border-box;padding:8px;font:inherit;background:rgba(0,0,0,.8);color:#fff;border:2px solid #fff;border-radius:0}
#toast{position:absolute;left:50%;top:15%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:6px 12px;font-weight:600;opacity:0;transition:opacity .25s;font-size:13px;max-width:92vw;text-align:center}
#case,#gm,#dead{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,12,24,.85);overflow:auto}
.cp{width:min(760px,100%);background:var(--panel);border:4px solid #3a4f80;padding:14px;margin:auto}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.ch b{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold)}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}
.cc{border:3px solid;padding:8px;background:#0f1a33}
.cc h3{margin:0 0 4px;font-size:14px}
.cc ul{margin:6px 0;padding-left:14px;font-size:11px;color:var(--mut)}
#reel{position:relative;overflow:hidden;height:84px;margin:12px 0 6px;background:#0a1226;border:3px solid #3a4f80}
#strip{display:flex;height:100%;will-change:transform}
.it{flex:0 0 96px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:12px;font-weight:600;border-right:2px solid #0a1226;border-bottom:4px solid}
.r0{border-color:#9fb0d3;background:#1d2a48}.r1{border-color:#4aa3ff;background:#173a66}.r2{border-color:#b86bff;background:#35205c}.r3{border-color:#ffcf33;background:#5a4510}
#pin{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;transform:translateX(-50%)}
#res{min-height:20px;margin:4px 0 0;font-weight:600;font-size:13px}
#tabs{display:flex;gap:4px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #2b3d66;font-size:13px}.row small{color:var(--mut)}
#gb h3{color:var(--gold);margin:10px 0 4px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#c6c6c6;padding:6px;border:3px solid;border-color:#fff #555 #555 #fff;margin-top:6px}
.mgrid.hb{margin-top:8px}
.mslot{aspect-ratio:1;background:#8b8b8b center/72% no-repeat;border:2px solid;border-color:#373737 #fff #fff #373737;image-rendering:pixelated;position:relative;cursor:pointer}
.mslot.sel{outline:3px solid var(--gold);outline-offset:-3px}
.mslot span{position:absolute;right:1px;bottom:0;font:600 11px Rubik,sans-serif;color:#fff;text-shadow:1px 1px #000}
.ic{display:inline-block;width:20px;height:20px;background:center/contain no-repeat;vertical-align:middle;margin-right:6px;image-rendering:pixelated}
.armor-wrap{display:flex;gap:12px;align-items:center;background:#0f1a33;border:2px solid #3a4f80;padding:8px 10px;margin:6px 0}
.armor-slots{display:grid;grid-template-columns:repeat(4,44px);gap:6px}
.aslot{width:44px;height:44px;background:#263455 center/74% no-repeat;border:2px solid #5c75b0;position:relative;cursor:pointer;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(255,255,255,.25)}
.aslot.eq{border-color:var(--gold);background-color:#354a78;color:transparent}
.aslot:hover{border-color:#fff}
</style>
</head>

<div id="menu"><div class="box">

function armor(){
  if(!Array.isArray(P.eq))return 0;
  let pts=0;
  for(const k of P.eq)if(k&&ARM_META[k])pts+=ARM_META[k].def;
  return Math.round(pts);
}
function equipArmor(k){
  const m=ARM_META[k];if(!m||inv(k)<=0)return false;
  if(!Array.isArray(P.eq)||P.eq.length!==4)P.eq=[null,null,null,null];
  const prev=P.eq[m.slot];
  add(k,-1);
  if(prev)add(prev,1);
  P.eq[m.slot]=k;
  toast(tt('armEq',nm(k)));
  saveNow();stat();
  return true;
}
function unequipArmor(idx){
  if(!Array.isArray(P.eq)||!P.eq[idx])return;
  const k=P.eq[idx];
  P.eq[idx]=null;
  add(k,1);
  toast(tt('armUneq',nm(k)));
  saveNow();stat();
}

const PHASE_SEC=300; // 5 хвилин = 300 секунд день, 300 секунд ніч

function dayNightTick(dt){
  worldTime+=dt;

  const night=cyc>=PHASE_SEC;
  if(playing&&night!==wasNight){
    const msg=tt(night?'nightFall':'dayRise');
    toast(msg);sysChat(msg);
  }
  wasNight=night;
  let light=1;
  if(cyc<25)light=.16+.84*(cyc/25);
  else if(cyc<PHASE_SEC-25)light=1;
  else if(cyc<PHASE_SEC)light=1-.84*((cyc-(PHASE_SEC-25))/25);
  else if(cyc<PHASE_SEC*2-25)light=.16;
  else light=.16+.84*((cyc-(PHASE_SEC*2-25))/25);
  skyCol.setRGB(.62*light,.83*light,Math.max(.14,light));
  scene.background.copy(skyCol);
  scene.fog.color.copy(skyCol);
  mat.color.setRGB(Math.max(.34,light),Math.max(.34,light),Math.max(.42,light));
}

    p.on('connection',conn=>{
      const id=conn.peer;
      conn.on('open',()=>{this.clients.set(id,{conn,seen:Date.now()});this.pres.set(id,{on:0,n:''});this.dirty=true});
      conn.on('data',m=>{
        const c=this.clients.get(id);if(c)c.seen=Date.now();
        if(!m||typeof m!=='object')return;
        if(m.k==='pres'&&m.d&&typeof m.d==='object'){this.pres.set(id,m.d);this.dirty=true}
        else if(m.k==='ev'&&typeof m.type==='string'){this._relay(m.type,id,m.data,id)}
        else if(m.k==='nick'){this._send(conn,{k:'nickr',rid:m.rid,ok:this._claim(id,m.n)})}
      });
      conn.on('close',()=>this._drop(id));
      conn.on('error',()=>this._drop(id));
    });
    p.on('error',err=>{
      if(err&&err.type==='unavailable-id'){this._asClient()}
      else if(!this.ok){this._reset();this._retry(3000)}
    });
    p.on('disconnected',()=>{if(this.isHost&&!p.destroyed){try{p.reconnect()}catch(e){}}});
  }
  _asClient(){
    try{this.peer&&this.peer.destroy()}catch(e){}
    let p;
    try{p=new Peer()}catch(e){return this._retry(3000)}
    this.peer=p;let opened=false;
    p.on('open',id=>{
      this._myPeerId=id;
      const conn=p.connect(HUB_ID,{reliable:true});
      this.up=conn;
      const to=setTimeout(()=>{if(!opened){this._reset();this._retry(1500)}},8000);
      conn.on('open',()=>{
        opened=true;clearTimeout(to);
        this.ok=true;this._fireC();
        this._send(conn,{k:'pres',d:this.pres.get(this.myId)});
      });
      conn.on('data',m=>{
        if(!m||typeof m!=='object')return;
        if(m.k==='peers'&&m.list){
          const me=this.pres.get(this.myId);
          const np=new Map();
          for(const [id,pr] of Object.entries(m.list)){
            if(id===p.id)continue;
            np.set(id===HUB_ID?HUB_ID:id,pr);
          }
          np.set(this.myId,me);
          this.pres=np;this._fireP();
        }else if(m.k==='ev'&&typeof m.type==='string'){
          this._fireEv(m.type,m.peer===p.id?this.myId:m.peer,m.data);
        }else if(m.k==='nickr'){
          const cb=this.pend.get(m.rid);if(cb){this.pend.delete(m.rid);cb(!!m.ok)}
        }
      });
      conn.on('close',()=>{this._reset();this._retry()});
      conn.on('error',()=>{this._reset();this._retry()});
    });
    p.on('error',err=>{
      if(!this.ok){this._reset();this._retry(err&&err.type==='peer-unavailable'?300:3000)}
    });
    p.on('disconnected',()=>{});
  }
}
async function netInit(){
  try{if(window.claude&&claude.use){const r=await claude.use('room');if(r){netSetup(r);return}}}catch(e){}
  if(!(await loadPeerJS()))return;
  netSetup(new PeerRoom());
}
netInit();
function setLang(l){
  curLang=l;LI=LK[l];document.documentElement.lang=l;
  try{localStorage.setItem('rc_lang',l)}catch(e){}
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tt(e.dataset.t));
  $('#chatin input').placeholder=tt('chatPh');
  $('#langSel').value=l;
  refreshLabels();hotbar();stat();
  if(ui==='gm')renderGm();if(ui==='case')renderCase();
}
$('#langSel').onchange=e=>setLang(e.target.value);
try{const saved=localStorage.getItem('rc_local_save');if(saved)P={...P,...JSON.parse(saved)}}catch(e){}
if(P.wv!==7){P.edits={};P.pos=null;P.home=null;P.wv=7}
if(!Array.isArray(P.eq)||P.eq.length!==4)P.eq=[null,null,null,null];
$('#nick').value=P.nick||'Steve';
applyEdits(P.edits||{});build();flush(999);
setLang(curLang);
$('#play').disabled=false;
let last=performance.now(),lastInfo=0,lastCull=0;
function loop(now){
  const dt=Math.min((now-last)/1000,.033);last=now;
  dayNightTick(dt);
  flush(2);npcTick(now);villTick(now,dt);netTick(now,dt);if(now-lastCull>300){lastCull=now;cullChunks()}
  if(playing){
    update(dt);
    zombieTick(dt);
    camera.position.set(pos.x,pos.y+1.62,pos.z);
    camera.rotation.set(pitch,yaw,0);
    camera.updateMatrixWorld();
    breakTick(dt,now);
    const r=ray();sel.visible=!!r;
    if(r)sel.position.set(r.h[0]+.5,r.h[1]+.5,r.h[2]+.5);
    if(now-lastInfo>250){lastInfo=now;
      const rem=Math.ceil(PHASE_SEC-(worldTime%PHASE_SEC));
      const mm=Math.floor(rem/60),ss=String(rem%60).padStart(2,'0');
      const tStr=tt(isNight()?'nightSt':'daySt',mm,ss);
      $('#info').textContent=`${P.nick} | ♥ ${P.hp}/20${armor()?' | 🛡 '+armor():''} | ${tStr} | X:${pos.x.toFixed(0)} Y:${pos.y.toFixed(0)} Z:${pos.z.toFixed(0)}${room?' | 👥 '+online:''}`;
    }
  }else{
    const a=now*.00008;
    camera.position.set(CX+Math.cos(a)*38,SY+16,CZ+Math.sin(a)*38);
    camera.lookAt(CX,SY+2,CZ);
  }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
